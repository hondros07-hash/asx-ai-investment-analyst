name: V24 Stage 5 release verification
on:
  pull_request:
    paths:
      - 'api/**'
      - 'services/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'scripts/deployment_smoke.py'
      - 'tests/test_v245_deployment.py'
      - '.dockerignore'
      - '.github/workflows/v24-stage5-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest --import-mode=importlib -q tests/test_v245_deployment.py tests/test_v243_integration.py tests/test_v242_workspace.py tests/test_v241_research_routes.py tests/test_v246_research_memory.py tests/test_v247_research_memory_routes.py tests/test_v248_explainability.py tests/test_v249_personal_research.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund && npm run lint && npm run build
        working-directory: frontend
        env:
          AXIA_SITE_URL: https://staging.example.invalid
          AXIA_API_URL: http://127.0.0.1:8000
      - run: docker compose -f deploy/compose.yaml config -q
        env:
          AXIA_SITE_URL: https://staging.example.invalid
      - run: docker build -f api/Dockerfile -t axia-api:ci .
      - run: docker build -f frontend/Dockerfile --build-arg AXIA_SITE_URL=https://staging.example.invalid -t axia-frontend:ci .
      - run: docker compose -f deploy/compose.yaml up -d --build
        env:
          AXIA_SITE_URL: https://staging.example.invalid
      - run: |
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: python scripts/deployment_smoke.py
        env:
          AXIA_SMOKE_ORIGIN: http://127.0.0.1:3000
      - if: always()
        run: docker compose -f deploy/compose.yaml logs --tail=100 && docker compose -f deploy/compose.yaml down
        env:
          AXIA_SITE_URL: https://staging.example.invalid
