name: AXIA Fundamentals CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2" "numpy>=1.26" "plotly>=5.24" "streamlit>=1.52.1,<2" "yfinance>=0.2.54"
      - name: Compile financial modules and view
        run: python -m compileall -q services views/fundamentals_view.py
      - name: Run isolated fundamentals regression suite
        run: |
          python -m unittest -v \
            tests.test_fundamentals_statement_view \
            tests.test_earnings_quality_engine \
            tests.test_fundamentals_performance_chart_engine
