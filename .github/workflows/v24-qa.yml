name: V24 migration QA
on:
  pull_request:
    paths:
      - 'api/**'
      - 'services/**'
      - 'frontend/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/v24-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_v243_integration.py tests/test_v242_workspace.py tests/test_v241_research_routes.py tests/test_navigation_performance_v2312.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          AXIA_API_URL: http://127.0.0.1:8000
          AXIA_SITE_URL: https://axiaindex.com
